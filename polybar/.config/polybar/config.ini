[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #b4befe
secondary = #f5e0dc
alert = #f38ba8
disabled = #707880

[bar/example]
width = 100%
height = 20pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 2pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

#[bar/your_bar_name]
font-0 = "JetBrainsMono:size=10;2"
font-1 = "JetBrains Mono Nerd Font:size=10;2"

# 1. Define the module placement layout
# REMOVE the workspace module from modules-left
# ADD the 'tray' module to the front of modules-left
modules-left = rofi-launcher cheatsheet-launcher ghlp jv-launch i3
modules-center = xwindow
modules-right = pulseaudio memory cpu date tray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

# 2. Configure the standalone tray module behavior (Required for Polybar 3.6+)
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-padding = 2
tray-size = 16px



; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
;[module/systray]
;type = internal/tray

;format-margin = 8pt
;tray-spacing = 16pt

[module/i3]
type = internal/i3

; Only show workspaces defined on the same output as the bar
pin-workspaces = true

; Use %name% to render the true name/number
label-focused = %name%
label-focused-padding = 1
label-focused-foreground = #ffffff
label-focused-background = #3f3f3f

label-unfocused = %name%
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-padding = 1
label-urgent-background = #bd2c40

label-visible = %name%
label-visible-padding = 1



[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
enable-click = true
enable-scroll = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-background = ${colors.background-alt}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:25:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %I:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini


[module/cheatsheet-launcher]
type = custom/text
label = " C  "
label-foreground = #89B4FA
click-left = /home/jim/.config/scripts/i3-cheatsheet-picker.sh

[module/ghlp]
type = custom/text
label = " H  "
label-foreground = #CDD6F4
click-left = /home/jim/.config/scripts/launch_gh.sh

[module/jv-launch]
type = custom/text
label = " N  "
label-foreground = #53BF27
click-left = /home/jim/.config/scripts/launch_jv.sh

[module/clipman-launcher]
type = custom/text
# This uses the specific Nerd Font string for a clipboard icon
label = " Cl "
label-foreground = #A6E3A1
click-left = xfce4-popup-clipman

# A Placeholder for your future Rofi App Launcher
[module/rofi-launcher]
type = custom/text
label = " A  "
label-foreground = #F5C2E7
# This opens your application runner when clicked:
click-left = rofi -show drun -theme catppuccin-mocha
